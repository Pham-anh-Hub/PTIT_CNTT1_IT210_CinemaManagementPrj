<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - Cinema Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/home-page.css}">
    <style>
        :root {
            --bg:        #0f1117;
            --surface:   #161b27;
            --surface2:  #1c2235;
            --border:    #252d42;
            --orange:    #ff9800;
            --orange-lo: rgba(255,152,0,0.10);
            --red:       #e94560;
            --text:      #e8eaf0;
            --muted:     #5a6280;
            --input-bg:  #1a2035;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        /* ===== PAGE WRAPPER ===== */
        .page-wrap {
            max-width: 1080px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        /* ===== FLASH ===== */
        .flash-success {
            background: rgba(76,175,128,0.12);
            border: 1px solid rgba(76,175,128,0.3);
            border-radius: 10px;
            color: #4cdf80;
            padding: 12px 18px;
            margin-bottom: 24px;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.02em;
        }

        .page-title span { color: var(--orange); }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-size: 0.82rem;
            font-family: 'DM Sans', sans-serif;
            padding: 8px 18px;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-logout:hover {
            border-color: var(--red);
            color: var(--red);
            text-decoration: none;
        }

        /* ===== GRID ===== */
        .profile-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        /* ===== LEFT CARD ===== */
        .left-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Avatar */
        .avatar-zone {
            position: relative;
            display: inline-block;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .avatar-img {
            width: 100px; height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--orange);
            box-shadow: 0 0 0 4px rgba(255,152,0,0.15);
            display: block;
        }

        .avatar-overlay {
            position: absolute; inset: 0;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s;
        }

        .avatar-zone:hover .avatar-overlay { opacity: 1; }

        .avatar-overlay span {
            color: #fff; font-size: 11px; font-weight: 600;
            text-align: center; line-height: 1.4;
        }

        #avatarFileInput { display: none; }

        .avatar-hint {
            font-size: 11px; color: var(--muted);
            margin-bottom: 12px; text-align: center;
        }

        /* Name + badge */
        .user-name {
            font-size: 1rem; font-weight: 700;
            color: var(--text); margin-bottom: 6px;
            text-align: center;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .role-CUSTOMER { background: rgba(91,163,245,0.15); color: #5ba3f5; border: 1px solid rgba(91,163,245,0.3); }
        .role-STAFF    { background: rgba(255,152,0,0.12);  color: #ff9800; border: 1px solid rgba(255,152,0,0.3); }
        .role-ADMIN    { background: rgba(233,69,96,0.12);  color: #e94560; border: 1px solid rgba(233,69,96,0.3); }

        /* Readonly info rows */
        .divider-line {
            width: 100%; height: 1px;
            background: var(--border);
            margin: 4px 0 16px;
        }

        .info-block { width: 100%; }

        .info-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 14px;
        }

        .info-row:last-child { margin-bottom: 0; }

        .info-label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .info-value {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 0.85rem;
            color: #b0bbd4;
        }

        /* ===== RIGHT CARD ===== */
        .right-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 24px;
        }

        .card-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--orange);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        /* Form fields */
        .field { margin-bottom: 18px; }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 7px;
        }

        .field input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: 'DM Sans', sans-serif;
            padding: 12px 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field input:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(255,152,0,0.1);
        }

        .field input.is-invalid { border-color: var(--red); }
        .field input::placeholder { color: #2e3650; }

        /* Date input dark */
        .field input[type="date"] { color-scheme: dark; }

        .invalid-feedback {
            font-size: 0.75rem;
            color: var(--red);
            margin-top: 5px;
            display: block;
        }

        /* Save button */
        .btn-save {
            width: 100%;
            background: var(--orange);
            border: none;
            border-radius: 10px;
            color: #111;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            padding: 13px;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .btn-save:hover {
            background: #e08800;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(255,152,0,0.2);
        }

        /* Note */
        .note {
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
            margin-top: 12px;
        }

        @media (max-width: 768px) {
            .profile-grid { grid-template-columns: 1fr; }
            .field-row { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>

<div th:replace="~{layouts/navbar :: navbar}"></div>

<div class="page-wrap">

    <!-- Flash success -->
    <div class="flash-success" th:if="${successMsg}">
        ✔ <span th:text="${successMsg}"></span>
    </div>

    <!-- Top bar -->
    <div class="top-bar">
        <div class="page-title">Hồ sơ <span>cá nhân</span></div>
        <a th:href="@{/auth/logout}"
           class="btn-logout"
           onclick="return confirm('Bạn có chắc muốn đăng xuất không?')">
            Đăng xuất
        </a>
    </div>

    <form th:action="@{/cinema/profile/update}"
          th:object="${profileForm}"
          method="post"
          enctype="multipart/form-data">

        <div class="profile-grid">

            <!-- ══════════ CỘT TRÁI ══════════ -->
            <div class="left-card">

                <!-- Avatar -->
                <div class="avatar-zone"
                     onclick="document.getElementById('avatarFileInput').click()">
                    <img id="avatarPreview"
                         th:src="${profile.avatar != null}
                             ? (${profile.avatar.contains('http')}
                                 ? ${profile.avatar}
                                 : '/images/' + ${profile.avatar})
                             : 'https://ui-avatars.com/api/?background=ff9800&color=fff&size=110&name=' + (profile.fullName != null ? profile.fullName : profile.username)"
                         class="avatar-img" alt="avatar">
                    <div class="avatar-overlay">
                        <span>📷<br>Đổi ảnh</span>
                    </div>
                </div>

                <input type="file" id="avatarFileInput"
                       name="avatarFile"
                       accept="image/png,image/jpeg,image/webp">

                <p class="avatar-hint">Nhấp vào ảnh để thay đổi</p>

                <div class="user-name"
                     th:text="${profile.fullName != null ? profile.fullName : profile.username}">
                </div>

                <span class="role-badge"
                      th:class="'role-badge role-' + ${profile.role}"
                      th:text="${profile.role}">
                </span>

                <div class="divider-line"></div>

                <!-- Thông tin chỉ đọc -->
                <div class="info-block">

                    <div class="info-row">
                        <span class="info-label">Tên đăng nhập</span>
                        <span class="info-value" th:text="${profile.username}">—</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Email</span>
                        <span class="info-value" th:text="${profile.email}">—</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Ngày tham gia</span>
                        <span class="info-value"
                              th:text="${profile.createdAt != null
                                  ? #temporals.format(profile.createdAt, 'dd/MM/yyyy')
                                  : '—'}">
                        </span>
                    </div>

                </div>
            </div>

            <!-- ══════════ CỘT PHẢI ══════════ -->
            <div class="right-card">

                <div class="card-section-title">✏ Chỉnh sửa thông tin cá nhân</div>

                <!-- Họ và tên -->
                <div class="field">
                    <label>Họ và tên <span style="color:#e94560">*</span></label>
                    <input type="text"
                           th:field="*{fullName}"
                           th:class="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                           placeholder="Nguyễn Văn A">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}">
                    </div>
                </div>

                <!-- SĐT + Ngày sinh -->
                <div class="field-row">
                    <div class="field">
                        <label>Số điện thoại</label>
                        <input type="text"
                               th:field="*{phone}"
                               th:class="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                               placeholder="0912 345 678">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('phone')}"
                             th:errors="*{phone}">
                        </div>
                    </div>

                    <div class="field">
                        <label>Ngày sinh</label>
                        <input type="date"
                               th:field="*{birthDay}"
                               th:class="${#fields.hasErrors('birthDay')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('birthDay')}"
                             th:errors="*{birthDay}">
                        </div>
                    </div>
                </div>

                <!-- Địa chỉ -->
                <div class="field">
                    <label>Địa chỉ</label>
                    <input type="text"
                           th:field="*{address}"
                           th:class="${#fields.hasErrors('address')} ? 'is-invalid' : ''"
                           placeholder="123 Đường ABC, Quận 1, TP. HCM">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('address')}"
                         th:errors="*{address}">
                    </div>
                </div>

                <button type="submit" class="btn-save">Lưu thay đổi</button>

            </div>
        </div>

    </form>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
    document.getElementById('avatarFileInput').addEventListener('change', function () {
        const file = this.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            alert('Vui lòng chọn file ảnh (jpg, png, webp)');
            this.value = ''; return;
        }

        if (file.size > 2 * 1024 * 1024) {
            alert('Ảnh tối đa 2MB');
            this.value = ''; return;
        }

        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById('avatarPreview').src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
</script>
</body>
</html>
