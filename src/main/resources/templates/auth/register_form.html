<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5" >
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <h3 class="mb-1">Đăng ký</h3>
                            <p class="text-muted mb-0">
                                Tạo tài khoản để đặt vé nhanh hơn
                            </p>
                        </div>

                        <a th:href="@{/home}"
                           class="btn-close"></a>
                    </div>

                    <hr>

                    <form th:action="@{/auth/on-register}"
                          th:object="${registerDTO}"
                          method="post">

                        <!-- Error -->
                        <div th:unless="${errorMessage == null}"
                             class="alert alert-danger"
                             th:text="${errorMessage}">
                        </div>

                        <!-- Họ + Tên -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="lastName" class="form-label">
                                    Họ
                                </label>

                                <input type="text"
                                       id="lastName"
                                       th:field="*{lastName}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                                       placeholder="Nguyễn">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('lastName')}"
                                     th:errors="*{lastName}">
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="firstName" class="form-label">
                                    Tên
                                </label>

                                <input type="text"
                                       id="firstName"
                                       th:field="*{firstName}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                                       placeholder="Văn A">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('firstName')}"
                                     th:errors="*{firstName}">
                                </div>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="example@email.com">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label for="phone" class="form-label">
                                Số điện thoại
                            </label>

                            <input type="tel"
                                   id="phone"
                                   th:field="*{phone}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                   placeholder="0912 345 678">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('phone')}"
                                 th:errors="*{phone}">
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mật khẩu</label>
                                <input type="password" th:field="*{password}"
                                       class="form-control"
                                       th:classappend="${(errorMessage != null && errorMessage.contains('Mật khẩu')) || #fields.hasErrors('password')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Xác nhận mật khẩu</label>
                                <input type="password" th:field="*{confirmPassword}"
                                       class="form-control"
                                       th:classappend="${(errorMessage != null && errorMessage.contains('Mật khẩu')) || #fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''">

                                <div class="invalid-feedback" th:if="${errorMessage != null && errorMessage.contains('Mật khẩu')}"
                                     style="display: block;">
                                    [[${errorMessage}]]
                                </div>
                            </div>
                        </div>


                        <!-- Button -->
                        <div class="d-grid mt-3">
                            <button type="submit"
                                    class="btn btn-dark">
                                Tạo tài khoản
                            </button>
                        </div>

                        <div class="text-center mt-3">
                            <span class="text-muted">
                                Đã có tài khoản?
                            </span>

                            <a th:href="@{/auth/login}" class="text-decoration-none">
                                Đăng nhập
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);

        input.type =
            input.type === "password"
                ? "text"
                : "password";
    }
</script>

</body>
</html>
