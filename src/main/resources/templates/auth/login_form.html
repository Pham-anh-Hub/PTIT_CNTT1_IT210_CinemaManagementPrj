<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <h3 class="mb-1">Đăng nhập</h3>
                            <p class="text-muted mb-0">
                                Đăng nhập để quản lý vé, điểm thưởng và thông tin thành viên của bạn.
                            </p>
                        </div>

                        <a th:href="@{/home}"
                           class="btn-close"></a>
                    </div>

                    <hr>

                    <form th:action="@{/cinema/auth/login}"
                          th:object="${loginDTO}"
                          method="post">

                        <!-- ERROR CHUNG -->
<!--                        <div th:if="${param.error}"-->
<!--                             class="alert alert-danger">-->
<!--                            Sai email hoặc mật khẩu-->
<!--                        </div>-->

                        <!-- EMAIL -->
                        <div class="col-md-6 mb-3 w-100">

                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   class="form-control"

                                   th:classappend="${param.error} ? 'is-invalid'"
                                   placeholder="example@gmail.com">

                            <div class="invalid-feedback"
                                 th:if="${param.error}">
                                Email hoặc mật khẩu không đúng
                            </div>

                        </div>

                        <!-- PASSWORD -->
                        <div class="col-md-6 mb-3 w-100">

                            <label for="password" class="form-label">
                                Mật khẩu
                            </label>

                            <div class="input-group">

                                <input type="password"
                                       id="password"
                                       th:field="*{password}"
                                       class="form-control"

                                       th:classappend="${param.error} ? 'is-invalid'"
                                       placeholder="*********">

                                <button class="btn btn-outline-secondary"
                                        type="button"
                                        onclick="togglePassword('password')">
                                    Hiện
                                </button>

                            </div>

                            <div class="invalid-feedback d-block"
                                 th:if="${param.error}">
                                Email hoặc mật khẩu không đúng
                            </div>

                        </div>

                        <!-- BUTTON -->
                        <div class="d-grid mt-3">
                            <button type="submit"
                                    class="btn btn-dark">
                                Đăng nhập
                            </button>
                        </div>
                        <div class="text-center mt-3">
                            <span class="text-muted">
                                Bạn chưa có tài khoản?
                            </span>

                            <a th:href="@{/auth/register}" class="text-decoration-none">
                                Đăng ký
                            </a>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);

        input.type =
            input.type === "password"
                ? "text"
                : "password";
    }
</script>

</body>

</body>
</html>
