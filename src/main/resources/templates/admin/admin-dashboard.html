<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!--  style cho sidebar  -->
    <style>
        /* =========================
       LOGO
    ========================= */

        .logo-wrapper{
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-box{
            width: 60px;
            height: 40px;

            background: white;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .logo-box img{
            width: 60px;
            height: 40px;
            object-fit: cover;
        }

        .logo-text{
            color: white;
            line-height: 1.1;
            font-size: 18px;
        }
        /* Sidebar */
        .admin-sidebar {
            width: 230px; flex-shrink: 0;
            background: #16213e;
            display: flex; flex-direction: column;
            padding: 24px 0;
            position: sticky; top: 0; height: 100vh;
        }
        .sidebar-brand {
            padding: 0 20px 24px;
            font-size: 16px; font-weight: 700; color: #e94560;
            border-bottom: 1px solid #2a2a4a;
        }
        .sidebar-nav { flex: 1; padding: 16px 0; }
        .sidebar-link {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 20px;
            color: #aaa; text-decoration: none;
            border-left: 3px solid transparent;
            transition: all .15s;
        }
        .sidebar-link:hover { color: white; background: rgba(255,255,255,.05); text-decoration: none; }
        .sidebar-link.active { color: #e94560; border-left-color: #e94560; background: rgba(233,69,96,.08); }
        .sidebar-footer { padding: 16px 0; border-top: 1px solid #2a2a4a; }
        .search-bar .form-control:focus { border-color: #e94560; box-shadow: none; color: white; background: #0f3460; }

    </style>
    <style>
        body {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            background-color: #121417; /* Đảm bảo nền body tối đồng nhất */
        }

        /* Thẻ bao ngoài cùng dùng d-flex (đã có trong class HTML) */
        .admin-layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Sidebar - Cố định độ rộng và chiều cao */
        .admin-sidebar {
            width: 250px;
            flex-shrink: 0;
            background: #16213e;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        /* Page Wrapper - Chiếm phần còn lại */
        .page-wrapper {
            flex-grow: 1; /* Chiếm hết khoảng trống bên phải */
            padding: 40px 30px;
            overflow-x: hidden;
        }
        .page-wrapper { max-width: 100%; margin: 48px auto; padding: 0 24px 60px; }
        .page-title { font-size: 1.3rem;color: white; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
        .orange-line { height: 3px; width: 56px; background: #ff9800; margin-bottom: 32px; box-shadow: 0 0 10px rgba(255,152,0,0.4); }

        /* ===== STAT CARDS ===== */
        .stat-card { background: #1c1f24; border: 1px solid #2a2d33; border-radius: 12px; padding: 22px 24px; display: flex; align-items: center; gap: 16px; height: 100%; }
        .stat-icon { font-size: 2rem; }
        .stat-label { font-size: 0.72rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .stat-value { font-size: 1.4rem; font-weight: 700; }
        .orange { color: #ff9800; }
        .green  { color: #4caf80; }
        .blue   { color: #5ba3f5; }
        .red    { color: #f08080; }

        /* ===== CHART CARD ===== */
        .chart-card { background: #1c1f24; border: 1px solid #2a2d33; border-radius: 12px; padding: 24px; height: 100%; }
        .chart-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #ff9800; margin-bottom: 20px; }

        /* ===== BAR CHART (Doanh thu theo tháng) ===== */
        /*
         * Mỗi cột là 1 flex item gồm:
         *   - .bar-fill: div có height = percentage% (tính từ Java)
         *   - .bar-label: tên tháng bên dưới
         * Toàn bộ chart wrap trong .bar-chart (display: flex, align-items: flex-end)
         * → các cột tự "mọc lên" từ đáy
         */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 180px;          /* chiều cao tối đa của biểu đồ */
            padding-bottom: 8px;
            border-bottom: 1px solid #2a2d33;
        }

        .bar-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            gap: 6px;
        }

        .bar-fill {
            width: 100%;
            background: linear-gradient(to top, #ff9800, #ffb74d);
            border-radius: 4px 4px 0 0;
            min-height: 3px;          /* luôn hiện dù = 0 */
            transition: height 0.3s;
            position: relative;
        }

        /* Tooltip hiện doanh thu khi hover */
        .bar-fill:hover::after {
            content: attr(data-revenue);
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .bar-label {
            font-size: 0.65rem;
            color: #888;
            text-align: center;
            margin-top: 6px;
        }

        /* ===== HORIZONTAL BAR CHART (Top 5 phim) ===== */
        /*
         * Mỗi phim là 1 hàng gồm:
         *   - Tên phim bên trái
         *   - .hbar-track: nền xám làm "đường ray"
         *   - .hbar-fill: div có width = percentage% (tính từ Java)
         *   - Số tiền bên phải
         */
        .hbar-list { display: flex; flex-direction: column; gap: 16px; }

        .hbar-item { display: flex; flex-direction: column; gap: 6px; }

        .hbar-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hbar-title { font-size: 0.85rem; font-weight: 600; color: #e0e0e0; }
        .hbar-revenue { font-size: 0.8rem; color: #ff9800; font-weight: 700; white-space: nowrap; }

        .hbar-track {
            background: #242830;
            border-radius: 6px;
            height: 10px;
            overflow: hidden;
        }

        .hbar-fill {
            height: 100%;
            border-radius: 6px;
            background: linear-gradient(to right, #ff9800, #ffcc02);
        }

        .hbar-meta { font-size: 0.72rem; color: #666; }
    </style>
</head>
<body>

<div class="admin-layout d-flex">
    <div th:replace="~{layouts/admin-sidebar::sidebar}"></div>

    <div class="page-wrapper">

        <div class="page-title">Dashboard Admin</div>
        <div class="orange-line"></div>

        <!-- ===== 4 THẺ THỐNG KÊ NHANH ===== -->
        <div class="row g-3 mb-4">

            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div>
                        <div class="stat-label">Tổng doanh thu</div>
                        <div class="stat-value orange"
                             th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT') + ' đ'}">
                            0 đ
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon"></div>
                    <div>
                        <div class="stat-label">Đơn đã xác nhận</div>
                        <div class="stat-value green" th:text="${totalConfirmBooking}">0</div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon">⏳</div>
                    <div>
                        <div class="stat-label">Đơn chờ xác nhận</div>
                        <div class="stat-value red" th:text="${totalPendingBooking}">0</div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon">👤</div>
                    <div>
                        <div class="stat-label">Khách hàng</div>
                        <div class="stat-value blue" th:text="${totalCustomers}">0</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- ===== 2 BIỂU ĐỒ ===== -->
        <div class="row g-3">

            <!-- Biểu đồ cột: Doanh thu theo tháng -->
            <div class="col-md-7">
                <div class="chart-card">
                    <div class="chart-title">📊 Doanh thu theo tháng (năm hiện tại)</div>

                    <!--
                        Thymeleaf vòng lặp qua 12 MonthlyRevenueDTO
                        Mỗi DTO đã có: month, revenue, percentage, monthName
                        CSS dùng percentage để set height của .bar-fill
                        VD: percentage=75 → height: 75% trong .bar-chart 180px → bar cao 135px
                    -->
                    <div class="bar-chart">
                        <div th:each="m : ${monthRevenue}" class="bar-item">
                            <div class="bar-fill"
                                 th:style="'height:' + ${m.percentToMax} + '%'"
                                 th:data-
                                 th:data-revenue="${#numbers.formatDecimal(m.revenue, 0, 'COMMA', 0, 'POINT') + 'đ'}">
                            </div>
                        </div>
                    </div>

                    <!-- Label tháng bên dưới -->
                    <div style="display:flex; gap:6px; margin-top:6px;">
                        <div th:each="m : ${monthRevenue}"
                             class="bar-label"
                             style="flex:1; text-align:center;"
                             th:text="${m.monthName}">
                        </div>
                    </div>

                </div>
            </div>

            <!-- Biểu đồ ngang: Top 5 phim -->
            <div class="col-md-5">
                <div class="chart-card">
                    <div class="chart-title">🎬 Top 5 phim doanh thu cao nhất</div>

                    <div class="hbar-list">
                        <div th:each="movie, stat : ${top5Movies}" class="hbar-item">

                            <div class="hbar-info">
                                <!-- Tên phim + hạng -->
                                <div class="hbar-title">
                                <span style="color:#ff9800; margin-right:6px;"
                                      th:text="'#' + ${stat.index + 1}"></span>
                                    <span th:text="${movie.movieTitle}">Tên phim</span>
                                </div>
                                <!-- Doanh thu -->
                                <div class="hbar-revenue"
                                     th:text="${#numbers.formatDecimal(movie.revenue, 0, 'COMMA', 0, 'POINT') + ' đ'}">
                                </div>
                            </div>

                            <!-- Thanh bar -->
                            <div class="hbar-track">
                                <div class="hbar-fill"
                                     th:style="'width:' + ${movie.percentToMax} + '%'">
                                </div>
                            </div>

                            <!-- Số đơn -->
                            <div class="hbar-meta"
                                 th:text="${movie.totalBookings} + ' đơn đặt vé'">
                            </div>

                        </div>

                        <!-- Khi chưa có data -->
                        <div th:if="${#lists.isEmpty(top5Movies)}"
                             style="color:#555; text-align:center; padding:40px 0;">
                            Chưa có dữ liệu
                        </div>
                    </div>

                </div>
            </div>

        </div>

    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons.js"></script>

</body>
</html>
