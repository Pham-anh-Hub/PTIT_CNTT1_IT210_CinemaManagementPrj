<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận đặt vé - Cinema Center</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/home-page.css}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">


    <style>
        body {
            background-color: #121417; /* Tone màu tối như trong ảnh */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #1a1d21;
            border-bottom: 1px solid #333;
        }
        .nav-link { color: #ffffff !important; }
        .nav-link.active { color: #ff5252 !important; border-bottom: 2px solid #ff5252; }

        .confirm-card {
            background-color: #1c1f24;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 30px;
            margin-top: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .info-label { color: #999; font-size: 0.9rem; margin-bottom: 2px; }
        .info-value { color: #eee; font-size: 1.1rem; font-weight: 500; margin-bottom: 15px; }

        .line-orange {
            height: 3px;
            background: #ff9800; /* Màu cam đặc trưng từ ảnh sơ đồ ghế */
            width: 100%;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(255,152,0,0.3);
        }

        .seat-tag {
            display: inline-block;
            background: #333;
            padding: 5px 12px;
            border-radius: 4px;
            margin-right: 8px;
            font-size: 0.9rem;
            border-left: 3px solid #ff9800;
        }
        .total-price { color: #ff9800; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>

<div th:replace="~{layouts/navbar::navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 confirm-card">
            <h3 class="text-center mb-4">XÁC NHẬN THÔNG TIN VÉ</h3>
            <div class="line-orange"></div>

            <div class="row mt-4">
                <div class="col-md-6">
                    <div class="info-label">Phim</div>
                    <div class="info-value" th:text="${showTime.movie.movieTitle}">Avengers: Infinity War</div>

                    <div class="info-label">Suất chiếu</div>
                    <div class="info-value" th:text="${showTime.startAt}">10:00 - Thứ Sáu, 08/05/2026</div>
                </div>
                <div class="col-md-6 text-md-end">
                    <div class="info-label">Phòng chiếu</div>
                    <div class="info-value" th:text="${showTime.room.roomName}">Room B</div>

                    <div class="info-label">Số lượng vé</div>
                    <div class="info-value" th:text="${selectedSeats.size() + ' vé'}">2 vé</div>
                </div>
            </div>

            <hr style="border-color: #444;">

            <div class="my-4">
                <div class="info-label mb-2">Vị trí ghế</div>
                <div>
                    <span th:each="seat : ${selectedSeats}" class="seat-tag">
                        [[${seat.seatName}]] (<small th:text="${seat.seatLevel}"></small>)
                    </span>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-5 p-3" style="background: rgba(255,255,255,0.05); border-radius: 8px;">
                <div>
                    <span class="info-label">Tổng số tiền cần thanh toán</span>
                    <div class="total-price" th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">240,000 đ</div>
                </div>
                <div>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary me-3 text-light">Quay lại</a>
                    <form th:action="@{/cinema/booking/payment}" method="POST" class="d-inline">
                        <button type="submit" class="btn btn-danger px-4 py-2 fw-bold">THANH TOÁN NGAY</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
