<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rạp chiếu phim</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/home-page.css}">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{layouts/navbar::navbar}"></div>

<!-- Slide banner-->
<div id="carouselId" class="carousel slide" data-ride="carousel" data-interval="3000">
    <ol class="carousel-indicators">
        <li data-target="#carouselId" data-slide-to="0" class="active"></li>
        <li data-target="#carouselId" data-slide-to="1"></li>
        <li data-target="#carouselId" data-slide-to="2"></li>
        <li data-target="#carouselId" data-slide-to="3"></li>
    </ol>

    <div class="carousel-inner" role="listbox">
        <div class="carousel-item active">
            <img src="https://i.ytimg.com/vi/PaMk-Ahcwuk/maxresdefault.jpg" alt="Slide 1">
        </div>
        <div class="carousel-item">
            <img src="https://i.ytimg.com/vi/AFkKZXbzHdI/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLD2rsR7gDP393o3J5cgqEe-8D29rQ"
                 alt="Slide 2">
        </div>
        <div class="carousel-item">
            <img src="https://vntravel.org.vn/zoom/480x288/uploads/images/blog/haingan116/2026/03/18/thumb-official-trailer-1998x1080-1773772149.png"
                 alt="Slide 3">
        </div>
        <div class="carousel-item">
            <img src="https://i.ytimg.com/vi/FWREapPB62w/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLDV0MlksxaIrZNsOvUGplNqSE6HPA"
                 alt="Slide 4">
        </div>
    </div>

    <a class="carousel-control-prev" href="#carouselId" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </a>
    <a class="carousel-control-next" href="#carouselId" role="button" data-slide="next">
        <span class="carousel-control-next-icon"></span>
    </a>
</div>

<!-- Danh sách phim -->
    <!-- Phim đang công chiếu -->
<div style="display: flex; justify-content: space-between; align-items: center; margin: 0 10px">
    <h2 class="text-light my-5">Phim đang công chiếu</h2>
</div>

<div style=" display: flex;gap: 20px;flex-wrap: wrap; margin: 10px 45px ;">
    <div th:each="m : ${movieNowShowing}"
         style="width: 22vw;">
        <a th:href="@{/cinema/movie/detail/{id}(id=${m.movieId})}" class="card h-80" style="border-radius: 18px; text-decoration: none; border: none; box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px; background: transparent">
            <img class="card-img-left"
                 th:src="${m.posterUrl != null && m.posterUrl.startsWith('http') ? m.posterUrl : '/images/' + m.posterUrl}"
                 alt="Movie Poster"
                 style="
                    width: 100%;
                    height: 300px;
                    object-fit: contain; ">
            <div class="card-body">
                <h4 class="card-title text-light"
                    th:text="${m.movieTitle}">
                </h4>
                <div style="display: flex; justify-content: space-between; align-items: center">
                    <p class="card-text text-light"
                       th:text="${m.description}">
                    </p>
                </div>
            </div>
        </a>
    </div>
</div>

    <!--  Phim sắp công chiếu  -->
<div style="display: flex; justify-content: space-between; align-items: center; margin: 0 10px">
    <h2 class="text-light my-5">Phim sắp công chiếu</h2>
</div>
<div style=" display: flex;gap: 20px;flex-wrap: wrap; margin: 10px 45px;">
    <div th:each="m : ${movieUpcoming}"
         style="width: 22vw;">
        <a th:href="@{/cinema/movie/detail/{id}(id=${m.movieId})}" class="card h-90" style="border-radius: 18px; border: none; box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;">
            <img class="card-img-top"
                 th:src="${m.posterUrl != null && m.posterUrl.startsWith('http') ? m.posterUrl : '/images/' + m.posterUrl}"
                 alt="Movie Poster"
                 style="
                  width: 100%;
                    height: 350px;
                    object-fit: cover; ">
            <div class="card-body">
                <h4 class="card-title"
                    th:text="${m.movieTitle}">
                </h4>
                <div style="display: flex; justify-content: space-between; align-items: center">
                    <p class="card-text"
                       th:text="${m.description}">
                    </p>
                </div>
            </div>
        </a>
    </div>
</div>


<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons.js"></script>
</body>
</html>
